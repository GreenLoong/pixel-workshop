name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Configure Python for Qt installer
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.11.1'
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true
          setup-python: false
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
      - name: Cache official OpenCV archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/opencv-cache/opencv-4.13.0-windows.exe
          key: opencv-windows-4.13.0-f0e98c302464
      - name: Install and verify OpenCV 4.13.0
        run: ./tools/ci/install-opencv.ps1 -CacheDirectory "${{ runner.temp }}/opencv-cache"
      - name: Configure Release with tests
        run: >-
          cmake -S ImageBatchTool -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          "-DOpenCV_DIR=$env:OPENCV_ROOT"
          -DIMAGEBATCHTOOL_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-ci --parallel 2
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure --output-junit test-results.xml
      - name: Test at 200 percent display scaling
        run: |
          $env:QT_SCALE_FACTOR='2'
          ctest --test-dir build-ci --output-on-failure --output-junit test-results-200.xml
      - name: Package Windows candidate
        run: >-
          ./tools/package-windows.ps1
          -BuildDirectory build-ci
          -QtDirectory "$env:QT_ROOT_DIR"
          -OpenCVDll "$env:OPENCV_ROOT/x64/vc16/bin/opencv_world4130.dll"
          -OutputDirectory build/pixel-workshop-candidate
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package
          path: |
            build/pixel-workshop-candidate.zip
            build/pixel-workshop-candidate.zip.sha256
          if-no-files-found: error
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-results
          path: |
            build-ci/test-results*.xml
            build-ci/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
  verify-package:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-package
          path: delivery
      - name: Verify package without installing Qt or OpenCV
        shell: pwsh
        run: |
          $taskHash=(Get-Content delivery/pixel-workshop-candidate.zip.sha256).Split(' ')[0]
          if((Get-FileHash delivery/pixel-workshop-candidate.zip -Algorithm SHA256).Hash -ne $taskHash) {throw 'Archive checksum mismatch.'}
          Expand-Archive delivery/pixel-workshop-candidate.zip -DestinationPath delivery/unpacked
          & ./delivery/unpacked/pixel-workshop-candidate/verify-package.ps1
      - name: Upload package verification record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package-verification
          path: delivery/unpacked/pixel-workshop-candidate/verification-result.json
          if-no-files-found: error
